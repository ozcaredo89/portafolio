name: Feature
description: Something new or a change in behaviour
labels: ["type:feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What do you want and why? (1–3 sentences)
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will you know it is done? One checkbox per behaviour.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      description: What should NOT change.
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S (≤ 1 h)", "M (≤ ½ day)", "L (split it)"]
